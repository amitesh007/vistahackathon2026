plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

group = 'com.loanservice'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport   // always generate report after tests
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test   // tests must run before report generation
    reports {
        xml.required  = true
        html.required = true
        csv.required  = false
    }
    // Report output: build/reports/jacoco/test/html/index.html
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.70   // enforce 70% line coverage
            }
        }
    }
}

// Convenience task: run tests + generate Jacoco report in one command
//   ./gradlew testWithCoverage
tasks.register('testWithCoverage') {
    group       = 'verification'
    description = 'Runs all tests and generates the Jacoco HTML + XML coverage report'
    dependsOn test, jacocoTestReport
}

bootRun {
    jvmArgs = [
        '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
    ]
}
