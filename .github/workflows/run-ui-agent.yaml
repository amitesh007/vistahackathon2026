name: Run UI Agent (Figma + Jira)

on:
  workflow_dispatch:
    inputs:
      figma_url:
        description: "Figma file or node URL (e.g. https://www.figma.com/design/...)"
        required: true
        type: string
      jira_ticket:
        description: "Jira ticket ID (e.g. VISTA-123)"
        required: true
        type: string
      task_description:
        description: "What to generate (e.g. 'Generate the loan summary card component')"
        required: true
        type: string

jobs:
  run-ui-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Jira MCP dependencies
        run: npm install --prefix .github/JiraMCP

      - name: Invoke ui-agent via GitHub Copilot Agent API
        id: invoke-agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_PAT: ${{ secrets.JIRA_PAT }}
          JIRA_AUTH_TYPE: ${{ secrets.JIRA_AUTH_TYPE }}
          REPO: ${{ github.repository }}
          FIGMA_URL: ${{ inputs.figma_url }}
          JIRA_TICKET: ${{ inputs.jira_ticket }}
          TASK: ${{ inputs.task_description }}
        run: |
          PAYLOAD=$(jq -n \
            --arg content "Figma URL: ${FIGMA_URL}\nJira Ticket: ${JIRA_TICKET}\nTask: ${TASK}" \
            '{"messages": [{"role": "user", "content": $content}]}')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/copilot/agents/ui-agent/completions" \
            -d "$PAYLOAD")

          echo "API Response: $RESPONSE"

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$CONTENT" ]; then
            echo "::warning::Agent returned no content."
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "Agent output:"
          echo "$CONTENT"
