replicaCount: 1

image:
  repository: ghcr.io/fin-lending/loan-service
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

ingress:
  enabled: true
  className: "lending-private"
  hosts:
    - host: loan-service.demo.local
      paths:
        - path: /api
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
