<header class="header">
  <div class="header-left">
    <button class="menu-toggle" (click)="onToggleSidebar()" aria-label="Toggle sidebar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <div class="brand">
      <span class="brand-name">FINASTRA</span>
      <span class="brand-divider"></span>
      <span class="brand-subtitle">Loan Portal</span>
    </div>
  </div>

  <div class="header-center">
    <div class="search-box">
      <input type="text" placeholder="Search here" class="search-input" (input)="onSearch($any($event.target).value)">
      <button class="search-button" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="8" cy="8" r="6"></circle>
          <path d="M13 13l5 5"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="header-right">
    <button class="icon-button" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="10" cy="10" r="2"></circle>
        <path d="M10 1v2m0 14v2M4.22 4.22l1.42 1.42m8.72 8.72l1.42 1.42M1 10h2m14 0h2M4.22 15.78l1.42-1.42m8.72-8.72l1.42-1.42"></path>
      </svg>
    </button>

    <button class="icon-button" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 6.5a5 5 0 0 0-10 0c0 7-3 9-3 9h16s-3-2-3-9M11.73 17a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="badge">3</span>
    </button>

    <button class="icon-button" aria-label="Messages">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="4" width="16" height="12" rx="2"></rect>
        <path d="M2 7l8 5 8-5"></path>
      </svg>
    </button>

    <button class="icon-button" aria-label="Help">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="10" cy="10" r="8"></circle>
        <path d="M7.5 7.5A2.5 2.5 0 0 1 10 5c1.38 0 2.5 1 2.5 2.5 0 1.5-2.5 2-2.5 3.5M10 14v.01"></path>
      </svg>
    </button>

    <button class="user-button">
      <div class="user-avatar">
        <svg width="32" height="32" viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="16" fill="#FFFFFF"/>
          <circle cx="16" cy="12" r="5" fill="#694ED6"/>
          <path d="M6 28c0-5.5 4.5-10 10-10s10 4.5 10 10" fill="#694ED6"/>
        </svg>
      </div>
    </button>
  </div>
</header>
