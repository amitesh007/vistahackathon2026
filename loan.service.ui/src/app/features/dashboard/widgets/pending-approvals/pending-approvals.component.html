<div class="pending-approvals card">
  <div class="card-header">
    <h3 class="card-title">Pending Approvals</h3>
    <div class="sort-dropdown">
      <label for="sort-by">Sort By</label>
      <select id="sort-by" [(ngModel)]="sortBy" (change)="onSortChange(sortBy)">
        <option value="customer">Customer</option>
        <option value="product">Product</option>
        <option value="task">Task</option>
      </select>
    </div>
  </div>

  <div class="card-body">
    <!-- Loading State -->
    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading approvals...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-state">
      <p class="error-message">{{ error }}</p>
      <button class="retry-button" (click)="loadApprovals()">Retry</button>
    </div>

    <!-- Approvals Table -->
    <div *ngIf="!loading && !error" class="table-responsive">
      <table class="approvals-table">
        <thead>
          <tr>
            <th>Customers</th>
            <th>Products</th>
            <th>Task</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let approval of approvals" class="approval-row">
            <td>
              <div class="customer-cell">
                <div class="customer-icon">{{ approval.customer.initials }}</div>
                <span class="customer-name">{{ approval.customer.name }}</span>
              </div>
            </td>
            <td>
              <span class="product-name">{{ getProductsDisplay(approval.products) }}</span>
            </td>
            <td>
              <span class="task-badge" [class.task-creation]="approval.task === 'Creation'" [class.task-amendment]="approval.task === 'Amendment'">
                {{ approval.task }}
              </span>
            </td>
            <td>
              <div class="action-buttons">
                <button class="action-btn action-btn--view" (click)="onView(approval)" title="View">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"></path>
                    <circle cx="9" cy="9" r="2"></circle>
                  </svg>
                </button>
                <button class="action-btn action-btn--approve" (click)="onApprove(approval)" title="Approve">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 5 7 14 2 9"></polyline>
                  </svg>
                </button>
                <button class="action-btn action-btn--reject" (click)="onReject(approval)" title="Reject">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="14" y1="4" x2="4" y2="14"></line>
                    <line x1="4" y1="4" x2="14" y2="14"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Empty State -->
      <div *ngIf="approvals.length === 0" class="empty-state">
        <p>No pending approvals</p>
      </div>
    </div>
  </div>
</div>
